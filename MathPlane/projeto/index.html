<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Math Plane</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="scene" aria-label="Avião em voo diante de dezesseis balões amarelos"></canvas>
    <header class="hud">
        <div class="challenge" aria-label="Desafio 1 de 10">
            <span>SOMA</span>
            <strong>1 / 10</strong>
        </div>

        <div class="title-panel">
            <strong>Math Plane</strong>
            <p><b>R</b> Reiniciar · <b>N</b> Dia/noite · <b>1</b> Vista lateral · <b>2</b> Vista diagonal</p>
        </div>

        <!-- Valores fixos: as regras matemáticas entram na Entrega 05. -->
        <div class="scores" aria-label="Atual 0 e meta 15">
            <div class="score current">
                <span>ATUAL</span>
                <strong>0</strong>
            </div>
            <div class="score target">
                <span>META</span>
                <strong>15</strong>
            </div>
        </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <script src="m4.js"></script>
    <script src="geometry.js"></script>
    <script src="airplane.js"></script>
    <script src="scene.js"></script>
</body>
</html>
